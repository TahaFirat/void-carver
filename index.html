<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#04060E" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' capacitor: ionic: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws: wss: capacitor: ionic: data: blob:; object-src 'none'; base-uri 'self';"
    />
    <title>VOID CARVER</title>
    <style>
      :root {
        --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --bg-deep: #04060E;
        --bg-card: #131A26;
        --border-subtle: rgba(255, 255, 255, 0.12);
        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
        --accent-easy: #10B981;
        --accent-medium: #F59E0B;
        --accent-hard: #EF4444;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-user-drag: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body,
      button,
      input,
      .ui-layer {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-deep);
        color: var(--text-primary);
        font-family: var(--font-ui) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
      }

      html,
      body {
        position: fixed;
        inset: 0;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-deep);
        touch-action: none;
        overflow: hidden;
      }

      #game-canvas {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #safe-area-probe {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
        pointer-events: none;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <div id="app">
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
