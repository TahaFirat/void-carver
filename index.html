<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#05070D" />
    <meta name="format-detection" content="telephone=no" />
    <title>VOID CARVER</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #05070D;
        color: #F4F7FF;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-variant-numeric: tabular-nums;
        overscroll-behavior: none;
        touch-action: none;
        position: fixed;
        inset: 0;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #05070D;
        touch-action: none;
        overflow: hidden;
      }

      /* V5 universal responsive canvas: always fills 100dvw x 100dvh (safe areas handled in JS) */
      #game-canvas {
        position: absolute;
        left: 0;
        top: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Hidden probe used by engine to measure exact safe-area insets */
      #safe-area-probe {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
        pointer-events: none;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <div id="app">
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
