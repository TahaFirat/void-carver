name: Build & Upload iOS IPA to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'App Store Build Numarası (örn: 1, 2, 3)'
        required: false
        default: ''

jobs:
  ios-release:
    name: Build & Upload to App Store Connect
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'N7XD86ZSMH' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'c4346abc-087b-4e87-a020-6737592faa26' }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD || 'LockIn2026!' }}
      TEAM_ID: 'U3YT2CXH58'
      BUNDLE_ID: 'com.tahafirat.voidcarver'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci || npm install

      - name: 4. Prepare iOS Assets & Sync
        run: |
          npm run build
          npm run ios:prepare

      - name: 5. Set Build Number
        working-directory: ios/App
        run: |
          BUILD_NUM="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "Setting build number to $BUILD_NUM"
          xcrun agvtool new-version -all "$BUILD_NUM"

      - name: 6. Install Apple Certificate & Auto-Provision Profile
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          elif [ -f "apple_certs/certificate.p12" ]; then
            cp apple_certs/certificate.p12 $RUNNER_TEMP/certificate.p12
          fi

          if [ -f "$RUNNER_TEMP/certificate.p12" ]; then
            security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
            echo "HAS_CERT=true" >> $GITHUB_ENV
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          if [ -z "$APP_STORE_CONNECT_API_KEY" ] && [ -f "apple_certs/AuthKey_N7XD86ZSMH.p8" ]; then
            export APP_STORE_CONNECT_API_KEY="$(cat apple_certs/AuthKey_N7XD86ZSMH.p8)"
          fi

          find_matching_profile() {
            PROFILE_FILE=""
            EXPECTED_APP_ID="${TEAM_ID}.${BUNDLE_ID}"
            for candidate in ios/App/*.mobileprovision apple_certs/*.mobileprovision; do
              [ -f "$candidate" ] || continue
              if ! security cms -D -i "$candidate" > "$RUNNER_TEMP/profile-candidate.plist" 2>/dev/null; then
                continue
              fi
              CANDIDATE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile-candidate.plist" 2>/dev/null || true)
              CANDIDATE_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile-candidate.plist" 2>/dev/null || true)
              if [ "$CANDIDATE_APP_ID" = "$EXPECTED_APP_ID" ] && [ "$CANDIDATE_TEAM_ID" = "$TEAM_ID" ]; then
                PROFILE_FILE="$candidate"
                return 0
              fi
            done
            return 1
          }

          find_matching_profile || true
          if [ -z "$PROFILE_FILE" ] && [ -n "$APP_STORE_CONNECT_API_KEY" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "Auto-provisioning Bundle ID & App Store Profile via App Store Connect API..."
            pip3 install --break-system-packages --quiet pyjwt cryptography requests || pip3 install --user --quiet pyjwt cryptography requests
            python3 - << 'PYEOF'
          import os, re, time, base64, jwt, requests

          key_id = os.environ.get('APP_STORE_CONNECT_KEY_ID', 'N7XD86ZSMH').strip()
          issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          raw_key = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          b64 = re.sub(r'-----BEGIN [^-]+-----|-----END [^-]+-----|\s+', '', raw_key)
          lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'

          token = jwt.encode(
              {'iss': issuer_id, 'iat': int(time.time()), 'exp': int(time.time()) + 1100, 'aud': 'appstoreconnect-v1'},
              pem, algorithm='ES256', headers={'kid': key_id, 'typ': 'JWT'}
          )
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          target_bundle = os.environ.get('BUNDLE_ID', 'com.tahafirat.voidcarver')

          # 1. Find or register Bundle ID
          r = requests.get('https://api.appstoreconnect.apple.com/v1/bundleIds', headers=headers, params={'filter[identifier]': target_bundle})
          data = r.json().get('data', [])
          bundle_id_res = None
          for b in data:
              if b['attributes']['identifier'] == target_bundle:
                  bundle_id_res = b['id']
                  break
          if not bundle_id_res:
              print(f"Registering Bundle ID {target_bundle}...")
              cr = requests.post('https://api.appstoreconnect.apple.com/v1/bundleIds', headers=headers, json={
                  'data': {
                      'type': 'bundleIds',
                      'attributes': {'identifier': target_bundle, 'name': 'Void Carver', 'platform': 'IOS'}
                  }
              })
              if cr.status_code in (200, 201):
                  bundle_id_res = cr.json()['data']['id']
                  print("Bundle ID registered:", bundle_id_res)

          # 2. Find Distribution Certificate
          cr = requests.get('https://api.appstoreconnect.apple.com/v1/certificates', headers=headers)
          certs = cr.json().get('data', [])
          dist_certs = [c['id'] for c in certs if 'DISTRIBUTION' in c['attributes'].get('certificateType', '')]

          # 3. Find or create IOS_APP_STORE Profile
          if bundle_id_res and dist_certs:
              prof_name = 'VoidCarver AppStore Profile'
              pr = requests.get('https://api.appstoreconnect.apple.com/v1/profiles', headers=headers, params={'filter[name]': prof_name})
              prof_content = None
              for p in pr.json().get('data', []):
                  if p['attributes'].get('profileState') == 'ACTIVE':
                      prof_content = p['attributes']['profileContent']
                      break
              if not prof_content:
                  cpr = requests.post('https://api.appstoreconnect.apple.com/v1/profiles', headers=headers, json={
                      'data': {
                          'type': 'profiles',
                          'attributes': {'name': prof_name, 'profileType': 'IOS_APP_STORE'},
                          'relationships': {
                              'bundleId': {'data': {'type': 'bundleIds', 'id': bundle_id_res}},
                              'certificates': {'data': [{'type': 'certificates', 'id': cid} for cid in dist_certs]}
                          }
                      }
                  })
                  if cpr.status_code in (200, 201):
                      prof_content = cpr.json()['data']['attributes']['profileContent']
              if prof_content:
                  os.makedirs('ios/App', exist_ok=True)
                  with open('ios/App/VoidCarver.mobileprovision', 'wb') as f:
                      f.write(base64.b64decode(prof_content))
                  print("Saved ios/App/VoidCarver.mobileprovision via API!")
          PYEOF
            find_matching_profile || true
          fi

          if [ -z "$PROFILE_FILE" ]; then
            echo "::error::No App Store provisioning profile matches ${TEAM_ID}.${BUNDLE_ID}. Refusing to upload a build for another app."
            exit 1
          fi

          if [ -f "$RUNNER_TEMP/certificate.p12" ]; then
            echo "Installing Provisioning Profile: $PROFILE_FILE"
            security cms -D -i "$PROFILE_FILE" > $RUNNER_TEMP/profile.plist
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" $RUNNER_TEMP/profile.plist)
            TEAM_ID_DETECT=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
            APP_ID_FULL=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" $RUNNER_TEMP/profile.plist)
            BUNDLE_ID_DETECT="${APP_ID_FULL#${TEAM_ID_DETECT}.}"
            if [ "$BUNDLE_ID_DETECT" != "$BUNDLE_ID" ]; then
              echo "::error::Selected profile is for ${BUNDLE_ID_DETECT}, expected ${BUNDLE_ID}."
              exit 1
            fi

            cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

            echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
            echo "TEAM_ID=${TEAM_ID_DETECT:-$TEAM_ID}" >> $GITHUB_ENV
            echo "BUNDLE_ID=${BUNDLE_ID_DETECT:-$BUNDLE_ID}" >> $GITHUB_ENV

            cat > ios/App/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID_DETECT:-$TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID_DETECT:-$BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          fi

      - name: 7. Build Xcode Project Archive
        run: |
          set -euo pipefail
          cd ios/App
          for i in 1 2 3; do
            xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies && break || sleep 5
          done
          if [ "${HAS_CERT:-false}" != "true" ] || [ -z "${PROFILE_NAME:-}" ]; then
            echo "::error::Apple distribution signing is unavailable; refusing to build an unsigned upload."
            exit 1
          fi
          echo "Applying target-scoped Release signing settings for ${BUNDLE_ID} (Build #${{ github.run_number }})..."
          python3 - << 'PYEOF'
          import os, re
          pbx_path = 'App.xcodeproj/project.pbxproj'
          text = open(pbx_path, 'r', encoding='utf-8').read()
          bundle_id = os.environ['BUNDLE_ID']
          team_id = os.environ['TEAM_ID']
          profile_name = os.environ['PROFILE_NAME']
          build_num = '${{ github.run_number }}'

          pattern = re.compile(r'(504EC3181FED79650016851F /\* Release \*/ = \{[\s\S]*?buildSettings = \{)([\s\S]*?)(\n\t\t\t\};)')
          def repl(m):
              body = m.group(2)
              updates = {
                  'CODE_SIGN_STYLE': 'Manual',
                  'CODE_SIGN_IDENTITY': '"Apple Distribution"',
                  'DEVELOPMENT_TEAM': team_id,
                  'PRODUCT_BUNDLE_IDENTIFIER': bundle_id,
                  'PROVISIONING_PROFILE_SPECIFIER': f'"{profile_name}"',
                  'CURRENT_PROJECT_VERSION': build_num,
              }
              for k, v in updates.items():
                  line_re = re.compile(rf'^(\s*){k} = [^;]*;$', re.MULTILINE)
                  if line_re.search(body):
                      body = line_re.sub(rf'\g<1>{k} = {v};', body)
                  else:
                      body += f'\n\t\t\t\t{k} = {v};'
              return m.group(1) + body + m.group(3)

          new_text, count = pattern.subn(repl, text, count=1)
          assert count == 1, 'Failed to locate App Release XCBuildConfiguration block in project.pbxproj'
          open(pbx_path, 'w', encoding='utf-8').write(new_text)
          print('Patched App target Release signing in project.pbxproj (SPM resource bundles unaffected).')
          PYEOF

          echo "Building signed app for ${BUNDLE_ID} (Build #${{ github.run_number }})..."
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     clean archive \
                     -archivePath ./build/App.xcarchive

      - name: 8. Export Official Signed App IPA
        run: |
          set -euo pipefail
          cd ios/App
          if [ ! -f "exportOptions.plist" ] || [ "${HAS_CERT:-false}" != "true" ] || [ -z "${PROFILE_NAME:-}" ]; then
            echo "::error::Signed export configuration is missing."
            exit 1
          fi
          echo "Exporting signed App.ipa using exportOptions.plist..."
          xcodebuild -exportArchive \
                     -archivePath ./build/App.xcarchive \
                     -exportPath ./build/export \
                     -exportOptionsPlist exportOptions.plist
          IPA_SOURCE=$(find ./build/export -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_SOURCE" ]; then
            echo "::error::Xcode did not produce a signed IPA."
            exit 1
          fi
          cp "$IPA_SOURCE" ./build/App.ipa

          IPA_CHECK_DIR=$(mktemp -d "$RUNNER_TEMP/ipa-check.XXXXXX")
          ditto -x -k ./build/App.ipa "$IPA_CHECK_DIR"
          APP_INFO_PLIST="$IPA_CHECK_DIR/Payload/App.app/Info.plist"
          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_INFO_PLIST")
          if [ "$ACTUAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "::error::Exported IPA has Bundle ID ${ACTUAL_BUNDLE_ID}; expected ${BUNDLE_ID}."
            exit 1
          fi
          codesign --verify --deep --strict "$IPA_CHECK_DIR/Payload/App.app"
          echo "Verified signed IPA for ${ACTUAL_BUNDLE_ID}."

      - name: 9. Upload Release Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: VoidCarver-Signed-iOS-App
          path: |
            ios/App/build/App.ipa
            ios/App/build/App.xcarchive
          retention-days: 14

      - name: 10. Upload to Apple TestFlight / App Store Connect
        if: env.APP_STORE_CONNECT_ISSUER_ID != ''
        run: |
          set -o pipefail

          if [ -z "$APP_STORE_CONNECT_API_KEY" ] && [ -f "apple_certs/AuthKey_N7XD86ZSMH.p8" ]; then
            export APP_STORE_CONNECT_API_KEY="$(cat apple_certs/AuthKey_N7XD86ZSMH.p8)"
          fi

          KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')

          pip3 install --break-system-packages --quiet pyjwt cryptography requests || pip3 install --user --quiet pyjwt cryptography requests

          python3 - << 'PYEOF'
          import os, re, time, jwt, requests

          key_id = os.environ.get('APP_STORE_CONNECT_KEY_ID', 'N7XD86ZSMH').strip()
          issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          raw = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          b64 = re.sub(r'-----BEGIN [^-]+-----|-----END [^-]+-----|\s+', '', raw)
          lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          for d in [os.path.expanduser('~/.appstoreconnect/private_keys'), os.path.expanduser('~/.private_keys'), './private_keys']:
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, f'AuthKey_{key_id}.p8')
              with open(p, 'w') as f:
                  f.write(pem)
              os.chmod(p, 0o600)

          # Wait up to 5 minutes if the App record for com.tahafirat.voidcarver is being created in App Store Connect UI
          for attempt in range(20):
              token = jwt.encode(
                  {'iss': issuer_id, 'iat': int(time.time()), 'exp': int(time.time()) + 900, 'aud': 'appstoreconnect-v1'},
                  pem, algorithm='ES256', headers={'kid': key_id, 'typ': 'JWT'}
              )
              headers = {'Authorization': f'Bearer {token}'}
              r = requests.get('https://api.appstoreconnect.apple.com/v1/apps', headers=headers, params={'filter[bundleId]': 'com.tahafirat.voidcarver'})
              apps = r.json().get('data', [])
              if apps:
                  print(f"Found App Store Connect App record for com.tahafirat.voidcarver (App ID: {apps[0]['id']})!")
                  break
              print(f"[Attempt {attempt+1}/20] Waiting for App record 'com.tahafirat.voidcarver' in App Store Connect (https://appstoreconnect.apple.com/apps)...")
              time.sleep(15)
          PYEOF

          UPLOAD_SUCCESS=false

          echo "=== Attempting Upload via xcrun altool ==="
          if xcrun altool --upload-app --type ios --file ./ios/App/build/App.ipa --apiKey "${KEY_ID}" --apiIssuer "${ISSUER_ID}" --verbose 2>&1 | tee altool.log; then
            UPLOAD_SUCCESS=true
          else
            cat altool.log >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            TRANSPORTER=$(find /Applications/Xcode* -name iTMSTransporter 2>/dev/null | head -n 1)
            if [ -n "$TRANSPORTER" ] && [ -x "$TRANSPORTER" ]; then
              if "$TRANSPORTER" -m upload -assetFile ./ios/App/build/App.ipa -apiKey "${KEY_ID}" -apiIssuer "${ISSUER_ID}" 2>&1 | tee itms.log; then
                UPLOAD_SUCCESS=true
              else
                cat itms.log >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            exit 1
          fi
